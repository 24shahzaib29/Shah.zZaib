<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <!-- Dark Cybernetic Background -->
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051009" />
      <stop offset="40%" stop-color="#020804" />
      <stop offset="100%" stop-color="#010302" />
    </linearGradient>

    <!-- Neon Green Rim Gradient -->
    <linearGradient id="neonRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00aa55" />
    </linearGradient>

    <!-- Matrix Code Stream Pattern -->
    <pattern id="matrixPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <text x="5" y="15" fill="#00ff88" opacity="0.15" font-family="monospace" font-size="10">01</text>
      <text x="25" y="30" fill="#00ff88" opacity="0.12" font-family="monospace" font-size="9">10</text>
      <text x="10" y="38" fill="#00ff88" opacity="0.08" font-family="monospace" font-size="8">&lt;&gt;</text>
    </pattern>

    <!-- Soft Ambient Glow Filters -->
    <filter id="portraitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="rimGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="600" height="700" rx="24" fill="url(#avatarBgGrad)" />
  <rect width="600" height="700" rx="24" fill="url(#matrixPattern)" />

  <!-- Ethereal Green Smoke & Ambient Energy in Background -->
  <circle cx="420" cy="280" r="180" fill="#00ff88" opacity="0.18" filter="url(#portraitGlow)" />
  <path d="M 0 300 Q 200 200 350 350 T 600 220" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.25" />
  <path d="M 50 450 Q 250 320 420 480 T 600 380" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.2" />

  <!-- Digital Code Matrix Overlay in Back -->
  <g fill="#00ff88" opacity="0.18" font-family="monospace" font-size="12">
    <text x="40" y="80">const developer = "Shahzaib";</text>
    <text x="40" y="110">const role = "Front-End Developer";</text>
    <text x="40" y="140">skills: ["HTML5", "CSS3", "JS"];</text>
    <text x="40" y="170">status: "Crafting UI/UX";</text>
  </g>

  <!-- Developer Silhouette / Stylized Profile Matching Image -->
  <g id="portrait-subject" transform="translate(40, 20)">
    <!-- Dark Hoodie Torso -->
    <path d="M 60 680 C 80 520, 160 450, 270 430 C 370 410, 480 470, 520 680 Z" fill="#0b110e" stroke="#12251a" stroke-width="3" />
    
    <!-- Hoodie Shoulders & Rim Glow -->
    <path d="M 70 680 C 95 530, 170 460, 275 440" fill="none" stroke="#00ff88" stroke-width="3" opacity="0.6" filter="url(#rimGlow)" />
    <path d="M 275 440 C 365 425, 460 475, 510 680" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.4" />

    <!-- Hoodie Neck & Drawstrings -->
    <path d="M 230 440 Q 280 485 330 440" fill="#060c09" stroke="#193325" stroke-width="2" />
    <line x1="260" y1="465" x2="255" y2="540" stroke="#00ff88" stroke-width="2" opacity="0.7" />
    <line x1="295" y1="465" x2="300" y2="535" stroke="#00ff88" stroke-width="2" opacity="0.7" />

    <!-- Neck with Subtle Green Edge Highlight -->
    <path d="M 255 350 L 255 440 L 320 440 L 320 350 Z" fill="#c49a78" opacity="0.9" />
    <path d="M 255 350 L 255 440" stroke="#00ff88" stroke-width="2.5" opacity="0.75" />

    <!-- Head / Side-Angled Face -->
    <!-- Jawline & Profile Shape (Facing slightly to the right) -->
    <path d="M 240 240 C 235 320, 260 380, 310 390 C 350 400, 375 360, 380 320 C 385 270, 380 230, 360 190 C 330 160, 270 170, 240 240 Z" fill="#d9ad8c" />

    <!-- Handsome Trimmed Beard & Jaw Silhouette -->
    <path d="M 255 310 C 265 375, 305 390, 335 385 C 360 380, 375 350, 380 320 C 375 330, 355 365, 330 365 C 300 365, 270 345, 265 315 Z" fill="#1b1715" />
    <path d="M 330 345 Q 355 348 370 330" fill="none" stroke="#1b1715" stroke-width="4" stroke-linecap="round" />

    <!-- Eye & Eyebrow in 3/4 Perspective -->
    <path d="M 320 240 Q 345 235 365 245" fill="none" stroke="#1c1613" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="345" cy="255" rx="7" ry="5" fill="#1c1613" />
    <circle cx="347" cy="253" r="2" fill="#ffffff" />

    <!-- Nose Profile -->
    <path d="M 355 245 L 372 275 L 358 285" fill="none" stroke="#b08565" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Lips -->
    <path d="M 345 310 Q 360 312 370 305" fill="none" stroke="#965f49" stroke-width="3" stroke-linecap="round" />

    <!-- Ear -->
    <ellipse cx="250" cy="275" rx="14" ry="22" fill="#cb9b7c" stroke="#996f53" stroke-width="1.5" />
    <path d="M 248 265 Q 254 275 248 285" fill="none" stroke="#7e533b" stroke-width="2" />

    <!-- Modern Textured Hair (Dark with Neon Edge Highlights) -->
    <path d="M 225 240 C 215 160, 260 120, 330 115 C 390 110, 410 160, 400 210 C 385 190, 380 165, 340 160 C 290 155, 255 190, 240 230 Z" fill="#161210" />
    <!-- Hair Strands & Texture -->
    <path d="M 250 145 Q 290 125 340 135" fill="none" stroke="#2b231f" stroke-width="5" />
    <path d="M 280 125 Q 330 115 375 140" fill="none" stroke="#2b231f" stroke-width="6" />
    <path d="M 330 125 Q 385 145 395 190" fill="none" stroke="#2b231f" stroke-width="5" />

    <!-- Cinematic Neon Green Rim Lighting along Face & Hair -->
    <path d="M 330 115 C 385 110, 408 155, 400 210" fill="none" stroke="#00ff88" stroke-width="3.5" opacity="0.9" filter="url(#rimGlow)" />
    <path d="M 370 240 Q 378 275 365 310" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.75" />
  </g>

  <!-- Replaceable Photo Helper Badge at bottom -->
  <g transform="translate(140, 640)">
    <rect width="320" height="34" rx="8" fill="rgba(3, 10, 6, 0.9)" stroke="#00ff88" stroke-width="1.2" opacity="0.95" />
    <text x="160" y="22" fill="#00ff88" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">
      Shahzaib Portrait (Replace with shahzaib.jpg anytime)
    </text>
  </g>
</svg>
